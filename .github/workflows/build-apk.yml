name: Build Installable HWPX Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Installable APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: cp app/build/outputs/apk/debug/app-debug.apk HWPX-Drive-Viewer.apk

      - name: Publish Direct Installable Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.1.${{ github.run_number }}-$(date +%s)"
          gh release create "$TAG" HWPX-Drive-Viewer.apk \
            --title "HWPX 구글 드라이브 뷰어 APK ($TAG)" \
            --notes "안드로이드 휴대폰에서 HWPX-Drive-Viewer.apk 파일을 다운로드하여 터치하면 자동 설치됩니다."
