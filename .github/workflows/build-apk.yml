name: Build Installable HWPX Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and Sign APK Directly
        run: bash cli/build-apk.sh

      - name: Upload Backup APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWPX-Drive-Viewer-APK
          path: HWPX-Drive-Viewer.apk

      - name: Publish Direct Installable Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.2.${{ github.run_number }}-$(date +%s)"
          gh release create "$TAG" HWPX-Drive-Viewer.apk \
            --title "HWPX 구글 드라이브 뷰어 APK ($TAG)" \
            --notes "안드로이드 휴대폰에서 HWPX-Drive-Viewer.apk 파일을 다운로드하여 터치하면 자동 설치됩니다."